components:
  schemas:
    FieldError:
      additionalProperties: false
      properties:
        field:
          type: string
        reason:
          type: string
      required:
        - field
        - reason
      type: object
    HealthzBody:
      additionalProperties: false
      properties:
        status:
          examples:
            - ok
          type: string
      required:
        - status
      type: object
    Problem:
      additionalProperties: false
      properties:
        code:
          type: string
        detail:
          type: string
        errors:
          items:
            $ref: "#/components/schemas/FieldError"
          type:
            - array
            - "null"
        instance:
          type: string
        request_id:
          type: string
        status:
          format: int64
          type: integer
        title:
          type: string
        type:
          type: string
      required:
        - type
        - title
        - status
        - code
      type: object
  securitySchemes:
    ApiKeyAuth:
      in: header
      name: X-API-Key
      type: apiKey
info:
  description: Сервис сокращения ссылок
  title: URL Shortener
  version: 1.0.0
openapi: 3.1.0
paths:
  /healthz:
    get:
      operationId: getHealthz
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthzBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Error
      security:
        - {}
      summary: Healthcheck
      tags:
        - system
security:
  - ApiKeyAuth: []
servers:
  - url: /
