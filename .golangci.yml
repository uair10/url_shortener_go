version: "2"

run:
  timeout: 5m

linters:
  # Все включено, отключено только лишнее. Новые линтеры при обновлении
  # golangci-lint включатся сами (версия зафиксирована в pre-commit).
  default: all
  disable:
    # Дубли
    - gocyclo # есть cyclop и gocognit
    # Слишком шумные / спорные
    - exhaustruct # требует заполнять все поля struct-литерала
    - exhaustruct_v5
    - varnamelen # запрещает короткие имена (i, w, r) - противоречит Go-стилю
    - wsl # пустые строки вокруг блоков
    - wsl_v5
    - nlreturn # пустая строка перед return
    - noinlineerr # запрещает идиоматичный if err := f(); err != nil
    - lll # длина строки
    - tagalign # выравнивание тегов
    - godox # TODO/FIXME в коде
    - testpackage # заставляет писать тесты только в package xxx_test
    - gosmopolitan # ругается на кириллицу в строках
    - depguard # без своего списка запретов бесполезен
    # Устаревшие (deprecated), заменены версиями _v2/_v5
    - gomodguard

  settings:
    govet:
      enable-all: true
      disable:
        - fieldalignment
    staticcheck:
      checks: ["all"]
    errcheck:
      check-type-assertions: true
    gosec:
      severity: low
      confidence: low
    forbidigo:
      forbid:
        - pattern: ^(fmt\.Print(f|ln)?|print|println)$
          msg: используй log/slog
    tagliatelle:
      case:
        rules:
          json: snake
    gocognit:
      min-complexity: 20
    cyclop:
      max-complexity: 15
    nestif:
      min-complexity: 5
    funlen:
      lines: 80
      statements: 50
    nolintlint:
      require-explanation: true
      require-specific: true
    exhaustive:
      default-signifies-exhaustive: true
    gocritic:
      enabled-tags: [diagnostic, style, performance]
      disabled-checks:
        - hugeParam
        - unnamedResult
    revive:
      # Все правила, кроме дублей других линтеров и шумных
      enable-all-rules: true
      rules:
        # Дубли
        - name: add-constant # mnd
          disabled: true
        - name: cognitive-complexity # gocognit
          disabled: true
        - name: cyclomatic # cyclop
          disabled: true
        - name: function-length # funlen
          disabled: true
        - name: line-length-limit # lll отключён
          disabled: true
        - name: unhandled-error # errcheck
          disabled: true
        - name: max-control-nesting # nestif
          disabled: true
        # Шумные
        - name: max-public-structs
          disabled: true
        - name: banned-characters
          disabled: true
        - name: file-header
          disabled: true
        - name: function-result-limit
          disabled: true
        - name: argument-limit
          disabled: true
        - name: flag-parameter
          disabled: true
        - name: import-alias-naming
          disabled: true
        # Подстройка
        - name: defer # recover() в функции, вызванной через defer f(), - нормальный паттерн
          arguments: [[call-chain, loop, method-call, return, immediate-recover]]
        - name: unchecked-type-assertion # явный `v, _ :=` - осознанный игнор
          arguments: [{acceptIgnoredAssertionResult: true}]
        - name: enforce-switch-style # default в switch не обязателен
          arguments: [allowNoDefault]

  exclusions:
    presets:
      - std-error-handling
    rules:
      # В тестах можно длинные функции и без оборачивания ошибок
      - path: _test\.go
        linters: [funlen, wrapcheck, gosec, forcetypeassert, err113, mnd, goconst, dupl, maintidx]

formatters:
  enable:
    - gofumpt
    - goimports
  settings:
    gofumpt:
      module-path: github.com/uair10/url_shortener_go
      extra:
        group-params: true
    goimports:
      local-prefixes:
        - github.com/uair10/url_shortener_go

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
