version: "2"

run:
  timeout: 5m

linters:
  default: standard # errcheck, govet, ineffassign, staticcheck, unused
  enable:
    # Ошибки
    - errorlint # errors.Is/As вместо ==, %w при оборачивании
    - wrapcheck # ошибки из чужих пакетов надо оборачивать контекстом
    - nilerr # return nil при err != nil
    - nilnil # return nil, nil
    - errname # ErrXxx для sentinel, XxxError для типов
    # Ресурсы и контекст
    - bodyclose # незакрытый resp.Body
    - sqlclosecheck # незакрытые sql.Rows/Stmt
    - rowserrcheck # не проверен rows.Err()
    - noctx # HTTP/SQL без context.Context
    - contextcheck # потерянный context
    - containedctx # context внутри struct
    # Корректность
    - exhaustive # switch по enum покрывает все значения
    - gosec # безопасность
    - copyloopvar
    - durationcheck
    - forcetypeassert # x.(T) без ok
    - musttag # json/yaml теги у сериализуемых структур
    # Стиль и чистота
    - revive
    - gocritic
    - misspell
    - unconvert
    - unparam
    - usestdlibvars
    - perfsprint
    - prealloc
    - intrange # for i := range n (Go 1.22+)
    - predeclared # переменная с именем len, new, ...
    - modernize # современные конструкции языка и stdlib (min/max, slices, maps, ...)
    - exptostd # golang.org/x/exp -> stdlib
    - iface # лишние и дублирующиеся интерфейсы
    - recvcheck # receiver одного типа: либо везде указатель, либо везде значение
    - nilnesserr # проверили err, но вернули другую ошибку
    - fatcontext # вложенные context в циклах
    - errchkjson # json.Marshal несериализуемых типов
    - canonicalheader # http.Header с неканоническими ключами
    - sloglint # единый стиль log/slog
    - gocheckcompilerdirectives
    - nolintlint # //nolint только с причиной
    - godot # комментарии заканчиваются точкой
    # Сложность
    - gocognit
    - cyclop
    - nestif
    - funlen
    # Тесты
    - thelper
    - tparallel
    - testifylint
    - usetesting

  settings:
    gocognit:
      min-complexity: 20
    cyclop:
      max-complexity: 15
    nestif:
      min-complexity: 5
    funlen:
      lines: 80
      statements: 50
    nolintlint:
      require-explanation: true
      require-specific: true
    exhaustive:
      default-signifies-exhaustive: true
    gocritic:
      enabled-tags: [diagnostic, style, performance]
      disabled-checks:
        - hugeParam # шумит на новичковом коде
        - unnamedResult
    revive:
      rules:
        - name: exported
        - name: package-comments
        - name: var-naming
        - name: receiver-naming
        - name: error-return
        - name: error-strings
        - name: error-naming
        - name: increment-decrement
        - name: indent-error-flow
        - name: early-return
        - name: superfluous-else
        - name: unused-parameter
        - name: unexported-return
        - name: context-as-argument
        - name: context-keys-type
        - name: blank-imports
        - name: dot-imports
        - name: range
        - name: time-naming
        - name: errorf

  exclusions:
    presets:
      - std-error-handling
    rules:
      # В тестах можно длинные функции и без оборачивания ошибок
      - path: _test\.go
        linters: [funlen, wrapcheck, gosec, forcetypeassert]

formatters:
  enable:
    - gofumpt
    - goimports
  settings:
    gofumpt:
      module-path: url-shortener
      extra:
        group-params: true
    goimports:
      local-prefixes:
        - github.com/uair10/url_shortener_go

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
